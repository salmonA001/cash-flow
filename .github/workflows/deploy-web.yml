# Deploys the web app (apps/web) to Vercel on every push to the default branch.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   Secret   VERCEL_TOKEN         Vercel → Account Settings → Tokens → Create
#   Variable NEXT_PUBLIC_API_URL  Public API URL, e.g. https://api.example.com
#
# The Vercel project "cash-flow-web" is created on the first run. The build runs here,
# where the whole pnpm monorepo is checked out, and the prebuilt output is uploaded.

name: Deploy web to Vercel

on:
  push:
    paths:
      - apps/web/**
      - '!apps/web/e2e/**'
      - '!apps/web/playwright.config.ts'
      - packages/validation/**
      - packages/shared-types/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: cash-flow-web
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      VERCEL_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check configuration
        working-directory: .
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing secret VERCEL_TOKEN. Create a token at https://vercel.com/account/tokens and add it under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::Missing variable NEXT_PUBLIC_API_URL (e.g. https://api.example.com). Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@64.5.0

      - name: Create Vercel project (first run only)
        run: |
          if vercel project inspect "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" > /dev/null 2>&1; then
            echo "Project $VERCEL_PROJECT exists"
          else
            vercel project create "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
          fi

      - name: Link project
        run: vercel link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to Vercel: $url" >> "$GITHUB_STEP_SUMMARY"
