# Cash Flow Engine OS — backend stack for the VPS. The web app is hosted on Vercel (see docs/DEPLOYMENT.md).
# Usage: cp .env.example .env  (fill in secrets)  →  docker compose up -d --build
# Optional monitoring: docker compose --profile monitoring up -d
# Image tags are pinned; see docs/DEPLOYMENT.md → "Upgrades" before changing them.

x-backend: &backend
  image: cfe-backend:local
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
    target: backend
  restart: unless-stopped
  networks: [internal]
  env_file: .env
  environment:
    NODE_ENV: production

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    # AOF persistence (fsync every second) so queued jobs survive restarts. BullMQ requires noeviction.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis-data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: cfe-minio:local
    build: infrastructure/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: cfe-minio:local
    build: infrastructure/minio
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes: ["./infrastructure/minio/init.sh:/init.sh:ro"]
    env_file: .env
    networks: [internal]
    restart: "no"

  migrate:
    <<: *backend
    command: ["sh", "-c", "cd packages/database && node node_modules/prisma/build/index.js migrate deploy && node dist/seed.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    command: ["node", "apps/api/dist/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend
    command: ["node", "apps/worker/dist/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Registers the repeatable maintenance schedules in Redis, then exits.
  scheduler:
    <<: *backend
    command: ["node", "apps/worker/dist/scheduler.js"]
    restart: "no"
    depends_on:
      redis: { condition: service_healthy }

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on: [api, minio]

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:12.2.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # Bound to localhost only — reach it through an SSH tunnel.
    ports: ["127.0.0.1:3001:3000"]
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
